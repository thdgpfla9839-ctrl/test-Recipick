server:
  port: 8080
  servlet:
    context-path: /
    spring:
      config:
        import:
          - optional:classpath:db.properties
          - optional:classpath:postgres.properties
          - optional:classpath:Ai.properties
  datasource:
    oracle:
      jdbc-url: ${sist_url}
      username: ${sist_username}
      password: ${sist_password}
      driver-class-name: oracle.jdbc.driver.OracleDriver
    postgres:
      jdbc-url: ${sist_post_url}
      username: ${post_username}
      password: ${post_password}
      driver-class-name: org.postgresql.Driver
      hikari:
        connection-timeout: 3000
        initialization-fail-timeout: -1
        validation-timeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    database: oracle
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect 
        format_sql: true
        user_sql_comments: true   
  thymeleaf:
    cache: false
    encoding: UTF-8
    prefix: classpath:templates/
    suffix: .html
    mode: HTML
  ai:
    google:
      genai:
        api-key: ${GEN_KEY}
        project-id: gen-lang-client-0074645742
        location: us-central1
        chat:
          options:
            model: gemini-3.6-flash
            temperature: 0.3
            thinking-level: MINIMAL
        embedding:
          api-key: ${GEN_KEY}
          project-id: gen-lang-client-0074645742
          text: 
            options:
              model: gemini-embedding-001
              dimensions: 768
    model: 
      embedding:

  mail:
    host: smtp.naver.com
    port: 587
    username: ${mail_username}
    password: ${mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt: 
  secret: ${jwt_secret}
  access-token-expiration: 1800000       # 30분
  refresh-token-expiration: 1209600000   # 14일
app:
  password-reset-url: http://localhost:5173/reset-password

mybatis:
  type-aliases-package: com.sist.web.vo
  mapper-locations: mybatis/mapper/*.xml
logging:
  level:
    com.sist.web.mapper: TRACE
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
cloudinary:
  cloud-name: ekfbpizi
  api-key: 727582415944147
  api-secret: ${IMG_KEY}
google:
  client-id: ${social_key}