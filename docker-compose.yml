services:

  # =====================================================
  # Redis
  # =====================================================
  redis:

    image: redis:7-alpine
    container_name: recipick-redis
    restart: always

    expose:
      - "6379"

    volumes:
      - redis-data:/data


  # =====================================================
  # Spring Boot Application
  # =====================================================
  app:

    # Docker Hub 이미지
    image: thdgpfla5659/recipick:latest

    # 컨테이너 자동 재시작
    restart: always

    # Spring Boot 환경변수
    environment:

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      sist_url: ${sist_url}
      sist_username: ${sist_username}
      sist_password: ${sist_password}

      sist_post_url: ${sist_post_url}
      post_username: ${post_username}
      post_password: ${post_password}

      GEN_KEY: ${GEN_KEY}
      IMG_KEY: ${IMG_KEY}
      social_key: ${social_key}
      jwt_secret: ${jwt_secret}

      mail_username: ${mail_username}
      mail_password: ${mail_password}

    # 외부에 포트를 직접 공개하지 않음
    expose:
      - "8080"

    # Spring Boot Health Check
    healthcheck:

      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s


  # =====================================================
  # Nginx
  # =====================================================
  nginx:

    image: nginx:latest
    container_name: nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy


volumes:
  redis-data: