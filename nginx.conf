events {}

http {
    server {
        listen 80;

        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 200 "Recipick backend is running.\n";
            add_header Content-Type text/plain;
        }
    }
}